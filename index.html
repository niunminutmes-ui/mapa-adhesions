function parseCSVLine(line) {
  const cols = [];
  let col = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      cols.push(col.trim());
      col = "";
    } else {
      col += ch;
    }
  }
  cols.push(col.trim());
  return cols;
}
function parseCSVServeis(text) {
  // Format Serveis_centre: centre_id | servei | pct
  const lines = text.trim().split("\n");
  if (lines.length < 2) return {};
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const cols = raw.split(",");
    const id = parseInt((cols[0]||"").trim());
    if (!id) continue;
    const servei = (cols[1]||"").trim().replace(/^"|"$/g,"");
    const pct = parseInt((cols[2]||"0").trim()) || 0;
    if (!result[id]) result[id] = { serveis: [] };
    if (servei) result[id].serveis.push({ servei: servei, pct: pct });
  }
  return result;
}

function parseCSVEstat(text) {
  // Format Full 1: ID(0) | Regio(1) | Nom(2) | ... | Estat(8)
  const lines = text.trim().split("\n");
  if (lines.length < 2) return {};
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const cols = parseCSVLine(raw);
    const id = parseInt((cols[0]||"").trim());
    if (!id) continue;
    const estat = (cols[8]||"").trim().replace(/^"|"$/g,"").toUpperCase();
    const regio = (cols[1]||"").trim().replace(/^"|"$/g,"");
    result[id] = { adherit: estat === "SI", regio: regio };
  }
  return result;
}

function parseCSV(text) {
  return parseCSVServeis(text);
}

async function fetchCSV(gid) {
  // Usem el Apps Script com a proxy per evitar CORS
  const data = await jsonpFetch(APPS_SCRIPT_URL + "?action=csv&gid=" + gid);
  if (!data.ok) throw new Error(data.error || "Error CSV");
  return data.text;
}

async function syncFromSheet() {
  setSyncState("loading", "Sincronitzant…");
  try {
    // Llegim els dos CSVs en paral·lel
    const [textServeis, textEstat] = await Promise.all([
      fetchCSV("791035390"),
      fetchCSV("1563800609")
    ]);
    const serveisData = parseCSVServeis(textServeis);
    const estatData = parseCSVEstat(textEstat);
    // Combinem: estat ve del Full 1, serveis de Serveis_centre
    sheetData = {};
    const allIds = new Set([...Object.keys(serveisData).map(Number), ...Object.keys(estatData).map(Number)]);
    allIds.forEach(id => {
      const e = estatData[id] || { adherit: false, regio: "" };
      sheetData[id] = {
        adherit: e.adherit,
        regio: e.regio,
        serveis: (serveisData[id] || {}).serveis || []
      };
    });
    // sheetData ja combinat a dalt
    lastSync = new Date();
    setSyncState("ok", "Actualitzat " + lastSync.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"}));
    renderMarkers();
    updateStats();
  } catch(e) {
    setSyncState("error", "Error de connexió");
    // Still render map with empty data so it loads
    renderMarkers();
    updateStats();
  }
}

function setSyncState(state, txt) {
  const dot = document.getElementById("sync-dot");
  dot.className = "sync-dot " + state;
  document.getElementById("sync-txt").textContent = txt;
}

function getHData(id) {
  return sheetData[id] || { adherit: false, pct: 0, serveis: [], data: "" };
}

window.addEventListener("load", function() {
  map = L.map("map", {zoomControl:true}).setView([41.65,1.85],8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors", maxZoom:17
  }).addTo(map);
  renderMarkers();
  updateStats();
  syncFromSheet();
  syncInterval = setInterval(syncFromSheet, 120000);
});

function makeIcon(adherit) {
  const color = adherit ? "#801D28" : "#2e7d32";
  const border = adherit ? "#5a1219" : "#1b5e20";
  return L.divIcon({
    className:"",
    html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2.5px solid ${border};box-shadow:0 1px 4px rgba(0,0,0,0.3)"></div>`,
    iconSize:[18,18], iconAnchor:[9,9], popupAnchor:[0,-12]
  });
}

function buildPopup(h) {
  const d = getHData(h.id);
  const statusHtml = d.adherit
    ? `<span class="popup-status status-adherit" style="font-size:15px;font-weight:700;">✓ Adherit</span>`
    : `<span class="popup-status status-no">○ No adherit</span>`;
  const serveisHtml = d.serveis && d.serveis.length > 0
    ? d.serveis.map(s => {
        return `<div style="padding:5px 0;border-bottom:1px solid #f0f0f0;">
          <span style="font-size:12px;color:#333;">${s.servei || s.nom}</span>
        </div>`;
      }).join("")
    : `<span class="no-serveis">Cap servei registrat encara</span>`;
  const dataStr = lastSync ? `Última sync: ${lastSync.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"})}` : "";
  return `
    <div class="popup-header">
      <h3>${h.nom}</h3>
      <p>${h.municipi} · ${d.regio || h.zona}</p>
    </div>
    <div class="popup-body">
      ${statusHtml}
      <hr class="popup-divider">
      <div class="popup-serveis">
        <h4 style="font-size:11px;font-weight:700;color:#801D28;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Serveis adherits</h4>
        ${serveisHtml}
      </div>
      <div class="popup-footer">${dataStr}</div>
    </div>`;
}

function renderMarkers() {
  HOSPITALS.forEach(h => {
    const d = getHData(h.id);
    if (markers[h.id]) {
      markers[h.id].setIcon(makeIcon(d.adherit));
      if (markers[h.id].isPopupOpen()) markers[h.id].setPopupContent(buildPopup(h));
    } else {
      const m = L.marker([h.lat,h.lng],{icon:makeIcon(d.adherit)}).addTo(map);
      m.bindPopup(buildPopup(h),{maxWidth:300});
      m.on("click",()=>{ m.setPopupContent(buildPopup(h)); });
      markers[h.id] = m;
    }
    if (currentZona && h.zona !== currentZona) {
      if (map.hasLayer(markers[h.id])) map.removeLayer(markers[h.id]);
    } else {
      if (!map.hasLayer(markers[h.id])) markers[h.id].addTo(map);
    }
  });
}

function updateStats() {
  const total = HOSPITALS.length;
  let adherits = 0;
  HOSPITALS.forEach(h => { if (getHData(h.id).adherit) adherits++; });
  const pct = Math.round(adherits/total*100);
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Centres totals</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-num" style="color:#2e7d32">${adherits}</div><div class="stat-lbl">Adherits</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-num" style="color:#888">${total-adherits}</div><div class="stat-lbl">Pendents</div></div>
    <div class="stat-sep"></div>
    <div class="progress-wrap">
      <div class="progress-lbl"><span>Progrés de la campanya</span><span style="font-weight:700;color:#801D28">${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
}

function filterZona(val) {
  currentZona = val;
  HOSPITALS.forEach(h => {
    if (!val || h.zona === val) { if (!map.hasLayer(markers[h.id])) markers[h.id].addTo(map); }
    else { if (map.hasLayer(markers[h.id])) map.removeLayer(markers[h.id]); }
  });
}

function adminLogin() {
  if (isAuth) {
    openEditPanel(null);
    return;
  }
  const pwd = prompt('Contrasenya d\'administrador:');
  if (pwd === PWD) {
    isAuth = true;
    openEditPanel(null);
  } else if (pwd !== null) {
    alert('Contrasenya incorrecta');
  }
}

function closeEditPanel() {
  document.getElementById('edit-panel').classList.remove('open');
  document.getElementById('edit-status').textContent = '';
}

function jsonpFetch(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    window[cbName] = function(data) {
      delete window[cbName];
      document.head.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + '&callback=' + cbName;
    script.onerror = () => { delete window[cbName]; reject(new Error('JSONP error')); };
    document.head.appendChild(script);
  });
}
async function loadCentreServeis() {
  const centreId = document.getElementById('edit-centre-select').value;
  if (!centreId) { document.getElementById('edit-serveis-section').style.display='none'; return; }
  document.getElementById('edit-status').textContent = 'Carregant...';
  document.getElementById('edit-serveis-section').style.display='block';
  const list = document.getElementById('edit-serveis-list');
  list.innerHTML = '';
  try {
    const url = APPS_SCRIPT_URL + '?action=get&centre_id=' + centreId;
    const data = await jsonpFetch(url);
    if (data.ok && data.serveis && data.serveis.length > 0) {
      data.serveis.forEach(s => addServeiRow(s.servei, s.pct));
    }
  } catch(e) {
    const d = sheetData[parseInt(centreId)];
    if (d && d.serveis && d.serveis.length > 0) {
      d.serveis.forEach(s => addServeiRow(s.nom || s.servei, s.pct));
    }
  }
  document.getElementById('edit-status').textContent = '';
}

function addServeiRow(nom, pct) {
  const list = document.getElementById('edit-serveis-list');
  const row = document.createElement('div');
  row.className = 'servei-row';
  // Creem el select manualment per assegurar que les opcions existeixen abans d'assignar valor
  const select = document.createElement('select');
  select.innerHTML = '<option value="">— Servei —</option>' + SERVEIS_OPTIONS;
  if (nom) select.value = nom;
  const input = document.createElement('input');
  input.type = 'number'; input.min = '0'; input.max = '100';
  input.value = parseInt(pct) || 0; input.placeholder = '%';
  const btn = document.createElement('button');
  btn.textContent = '🗑'; btn.onclick = function(){ this.parentElement.remove(); };
  row.appendChild(select);
  row.appendChild(input);
  row.appendChild(btn);
  list.appendChild(row);
}

async function saveServeis() {
  const centreId = parseInt(document.getElementById('edit-centre-select').value);
  if (!centreId) { alert('Selecciona un centre'); return; }
  const rows = document.querySelectorAll('#edit-serveis-list .servei-row');
  const serveis = [];
  for (const row of rows) {
    const servei = row.querySelector('select').value;
    const pct = parseInt(row.querySelector('input').value) || 0;
    if (servei) serveis.push({ servei, pct });
  }
  document.getElementById('edit-status').textContent = 'Guardant...';
  document.getElementById('edit-panel').querySelector('.btn-save').disabled = true;
  try {
    const params = new URLSearchParams({
      action: 'save',
      centre_id: centreId,
      serveis: JSON.stringify(serveis)
    });
    const data = await jsonpFetch(APPS_SCRIPT_URL + '?' + params.toString());
    if (data.ok) {
      document.getElementById('edit-status').textContent = '✓ Guardat correctament';
      await syncFromSheet();
      setTimeout(closeEditPanel, 1500);
    } else {
      document.getElementById('edit-status').textContent = 'Error: ' + (data.error||'desconegut');
    }
  } catch(e) {
    document.getElementById('edit-status').textContent = 'Error de connexió';
  }
  document.getElementById('edit-panel').querySelector('.btn-save').disabled = false;
}
