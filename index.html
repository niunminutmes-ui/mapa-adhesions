<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ni un minut més – Mapa d'adhesions | Metges de Catalunya</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial Narrow, Arial, sans-serif; background: #f5f5f5; color: #222; }
header { background: #801D28; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-circle { width: 44px; height: 44px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #801D28; font-size: 13px; letter-spacing: -0.5px; flex-shrink: 0; }
header h1 { font-size: 18px; font-weight: 700; }
header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.btn-admin { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; white-space: nowrap; }
.btn-admin:hover { background: rgba(255,255,255,0.25); }
.hero { width:100%; height:200px; overflow:hidden; position:relative; border-bottom:3px solid #801D28; }
.hero img { width:100%; height:100%; object-fit:cover; object-position:center 40%; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(128,29,40,0.5) 100%); }
.hero-caption { position:absolute; bottom:12px; left:20px; color:white; font-size:11px; opacity:0.85; letter-spacing:0.5px; text-transform:uppercase; text-shadow:0 1px 3px rgba(0,0,0,0.5); }
.stats-bar { background: white; border-bottom: 1px solid #ddd; padding: 10px 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: #888; line-height: 1; }
.stat-lbl { font-size: 11px; color: #666; margin-top: 2px; }
.stat-sep { width: 1px; height: 36px; background: #ddd; }
.progress-wrap { flex: 1; min-width: 200px; }
.progress-lbl { font-size: 11px; color: #666; margin-bottom: 4px; display: flex; justify-content: space-between; }
.progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: #801D28; border-radius: 5px; transition: width 0.6s; }
.legend { background: white; border-bottom: 1px solid #ddd; padding: 8px 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); }
.dot-red { background: #801D28; border-color: #5a1219; }
.dot-green { background: #2e7d32; border-color: #1b5e20; }
.filter-zona select { font-size: 12px; border: 1px solid #ccc; border-radius: 4px; padding: 3px 8px; font-family: inherit; color: #333; background: white; }
.sync-info { margin-left: auto; font-size: 11px; color: #999; display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
.sync-dot.ok { background: #2e7d32; }
.sync-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
.sync-dot.error { background: #c00; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
#map { height: calc(100vh - 195px); width: 100%; z-index: 1; }
.leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; min-width: 270px; }
.leaflet-popup-content { margin: 0; width: auto !important; }
.popup-header { background: #801D28; color: white; padding: 12px 14px; }
.popup-header h3 { font-size: 14px; font-weight: 700; line-height: 1.3; }
.popup-header p { font-size: 11px; opacity: 0.85; margin-top: 3px; }
.popup-body { padding: 12px 14px; }
.popup-status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.status-adherit { background: #f9e8ea; color: #801D28; }
.status-no { background: #fce4ec; color: #880e4f; }
.popup-pct { font-size: 28px; font-weight: 900; color: #801D28; line-height: 1; }
.popup-pct-lbl { font-size: 11px; color: #666; margin-top: 1px; }
.popup-divider { border: none; border-top: 1px solid #eee; margin: 10px 0; }
.popup-serveis h4 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.servei-tag { display: inline-block; background: #f3e5e7; color: #801D28; border-radius: 4px; padding: 2px 8px; font-size: 11px; margin: 2px 3px 2px 0; }
.no-serveis { font-size: 12px; color: #999; font-style: italic; }
.popup-footer { font-size: 11px; color: #aaa; margin-top: 10px; }

.modal { background: white; border-radius: 10px; width: 92%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
.modal-header { background: #801D28; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; }
.modal-header h2 { font-size: 16px; }
.modal-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; line-height: 1; }
.modal-body { padding: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; color: #444; margin-bottom: 5px; }
.form-group select, .form-group input[type=text], .form-group input[type=number], .form-group input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; }
.form-group small { font-size: 11px; color: #888; margin-top: 3px; display: block; }
.servei-input-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
.servei-input-row input { flex: 1; }
.btn-add-servei, .btn-del { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 6px 10px; font-size: 13px; }
.btn-add-servei { color: #801D28; border-color: #801D28; }
.btn-del { color: #c00; border-color: #c00; }
.btn-save { background: #801D28; color: white; border: none; border-radius: 6px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; font-family: inherit; }
.btn-save:hover { background: #6a1721; }
.btn-save:disabled { background: #ccc; cursor: not-allowed; }
.toggle-adherit { display: flex; align-items: center; gap: 10px; }
.toggle-adherit input[type=checkbox] { width: 18px; height: 18px; accent-color: #801D28; cursor: pointer; }
#login-screen p { font-size: 13px; color: #666; margin-bottom: 14px; }
#login-error { color: #c00; font-size: 13px; margin-top: 8px; display: none; }
.btn-login { background: #801D28; color: white; border: none; border-radius: 6px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.info-sheet { background: #f0f7ff; border: 1px solid #b3d4f5; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #1a4d7a; margin-bottom: 16px; line-height: 1.5; }
.info-sheet a { color: #1a4d7a; }
#msg-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 99999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }

.edit-panel { display:none; position:fixed; top:0; right:0; width:380px; height:100vh; background:white; box-shadow:-4px 0 20px rgba(0,0,0,0.2); z-index:99999; flex-direction:column; overflow:hidden; }
.edit-panel.open { display:flex; }
.edit-header { background:#801D28; color:white; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.edit-header h2 { font-size:15px; font-weight:700; }
.edit-close { background:none; border:none; color:white; font-size:20px; cursor:pointer; padding:0 4px; }
.edit-body { padding:16px; overflow-y:auto; flex:1; }
.edit-section { margin-bottom:16px; }
.edit-label { font-size:11px; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; display:block; }
.edit-select { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; background:white; }
.serveis-list { margin-top:8px; }
.servei-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #f0f0f0; }
.servei-row select { flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:4px; font-size:12px; font-family:inherit; }
.servei-row input[type=number] { width:64px; padding:6px 8px; border:1px solid #ddd; border-radius:4px; font-size:12px; text-align:center; }
.servei-row button { background:none; border:none; color:#c00; font-size:16px; cursor:pointer; padding:0 4px; flex-shrink:0; }
.btn-add-servei { width:100%; padding:8px; border:2px dashed #ddd; border-radius:6px; background:none; color:#666; font-size:13px; cursor:pointer; margin-top:8px; font-family:inherit; }
.btn-add-servei:hover { border-color:#801D28; color:#801D28; }
.edit-footer { padding:14px 16px; border-top:1px solid #eee; display:flex; gap:8px; flex-shrink:0; }
.btn-save { flex:1; padding:10px; background:#801D28; color:white; border:none; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-save:hover { background:#5a1219; }
.btn-cancel { padding:10px 16px; background:#f5f5f5; color:#333; border:none; border-radius:6px; font-size:14px; cursor:pointer; font-family:inherit; }
.edit-status { font-size:12px; color:#666; text-align:center; padding:4px 0; min-height:20px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-circle">MC</div>
    <div>
      <h1 style="font-size:22px;font-weight:900;">Ni un minut més — Mapa d'adhesions</h1>
      <p style="font-size:14px;">Metges de Catalunya · Seguiment de la campanya als <span style="color:#FFD700;font-weight:700;font-size:16px;">Centres Hospitalaris</span></p>
    </div>
  </div>
  <button class="btn-admin" onclick="adminLogin()">🔐 Accés direcció</button>
</header>

function parseCSVLine(line) {
  const cols = [];
  let col = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      cols.push(col.trim());
      col = "";
    } else {
      col += ch;
    }
  }
  cols.push(col.trim());
  return cols;
}
function parseCSVServeis(text) {
  // Format Serveis_centre: centre_id | servei | pct
  const lines = text.trim().split("\n");
  if (lines.length < 2) return {};
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const cols = raw.split(",");
    const id = parseInt((cols[0]||"").trim());
    if (!id) continue;
    const servei = (cols[1]||"").trim().replace(/^"|"$/g,"");
    const pct = parseInt((cols[2]||"0").trim()) || 0;
    if (!result[id]) result[id] = { serveis: [] };
    if (servei) result[id].serveis.push({ servei: servei, pct: pct });
  }
  return result;
}

function parseCSVEstat(text) {
  // Format Full 1: ID(0) | Regio(1) | Nom(2) | ... | Estat(8)
  const lines = text.trim().split("\n");
  if (lines.length < 2) return {};
  const result = {};
  for (let i = 1; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    const cols = parseCSVLine(raw);
    const id = parseInt((cols[0]||"").trim());
    if (!id) continue;
    const estat = (cols[8]||"").trim().replace(/^"|"$/g,"").toUpperCase();
    const regio = (cols[1]||"").trim().replace(/^"|"$/g,"");
    result[id] = { adherit: estat === "SI", regio: regio };
  }
  return result;
}

function parseCSV(text) {
  return parseCSVServeis(text);
}

async function fetchCSV(gid) {
  // Usem el Apps Script com a proxy per evitar CORS
  const data = await jsonpFetch(APPS_SCRIPT_URL + "?action=csv&gid=" + gid);
  if (!data.ok) throw new Error(data.error || "Error CSV");
  return data.text;
}

async function syncFromSheet() {
  setSyncState("loading", "Sincronitzant…");
  try {
    // Llegim els dos CSVs en paral·lel
    const [textServeis, textEstat] = await Promise.all([
      fetchCSV("791035390"),
      fetchCSV("1563800609")
    ]);
    const serveisData = parseCSVServeis(textServeis);
    const estatData = parseCSVEstat(textEstat);
    // Combinem: estat ve del Full 1, serveis de Serveis_centre
    sheetData = {};
    const allIds = new Set([...Object.keys(serveisData).map(Number), ...Object.keys(estatData).map(Number)]);
    allIds.forEach(id => {
      const e = estatData[id] || { adherit: false, regio: "" };
      sheetData[id] = {
        adherit: e.adherit,
        regio: e.regio,
        serveis: (serveisData[id] || {}).serveis || []
      };
    });
    // sheetData ja combinat a dalt
    lastSync = new Date();
    setSyncState("ok", "Actualitzat " + lastSync.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"}));
    renderMarkers();
    updateStats();
  } catch(e) {
    setSyncState("error", "Error de connexió");
    // Still render map with empty data so it loads
    renderMarkers();
    updateStats();
  }
}

function makeIcon(adherit) {
  const color = adherit ? "#801D28" : "#2e7d32";

  return L.divIcon({
    className:"",
    html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2.5px solid ${border};box-shadow:0 1px 4px rgba(0,0,0,0.3)"></div>`,
    iconSize:[18,18], iconAnchor:[9,9], popupAnchor:[0,-12]
  });
}

function buildPopup(h) {
  const d = getHData(h.id);
  const statusHtml = d.adherit
    ? `<span class="popup-status status-adherit" style="font-size:15px;font-weight:700;color:#801D28;">✓ Adherit</span>`
    : `<span class="popup-status status-no">○ No adherit</span>`;
  const serveisHtml = d.serveis && d.serveis.length > 0
    ? d.serveis.map(s => {
        return `<div style="padding:5px 0;border-bottom:1px solid #f0f0f0;">
          <span style="font-size:12px;color:#333;">${s.servei || s.nom}</span>
        </div>`;
      }).join("")
    : `<span class="no-serveis">Cap servei registrat encara</span>`;
  const dataStr = lastSync ? `Última sync: ${lastSync.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"})}` : "";
  return `
    <div class="popup-header">
      <h3>${h.nom}</h3>
      <p>${h.municipi} · ${d.regio || h.zona}</p>
    </div>
    <div class="popup-body">
      ${statusHtml}
      <hr class="popup-divider">
      <div class="popup-serveis">
        <h4 style="font-size:11px;font-weight:700;color:#801D28;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Serveis adherits</h4>
        ${serveisHtml}
      </div>
      <div class="popup-footer">${dataStr}</div>
    </div>`;
}

function renderMarkers() {
  HOSPITALS.forEach(h => {
    const d = getHData(h.id);
    if (markers[h.id]) {
      markers[h.id].setIcon(makeIcon(d.adherit));
      if (markers[h.id].isPopupOpen()) markers[h.id].setPopupContent(buildPopup(h));
    } else {
      const m = L.marker([h.lat,h.lng],{icon:makeIcon(d.adherit)}).addTo(map);
      m.bindPopup(buildPopup(h),{maxWidth:300});
      m.on("click",()=>{ m.setPopupContent(buildPopup(h)); });
      markers[h.id] = m;
    }
    if (currentZona && h.zona !== currentZona) {
      if (map.hasLayer(markers[h.id])) map.removeLayer(markers[h.id]);
    } else {
      if (!map.hasLayer(markers[h.id])) markers[h.id].addTo(map);
    }
  });
}

function updateStats() {
  const total = HOSPITALS.length;
  let adherits = 0;
  HOSPITALS.forEach(h => { if (getHData(h.id).adherit) adherits++; });
  const pct = Math.round(adherits/total*100);
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat"><div class="stat-num" style="color:#888">${total}</div><div class="stat-lbl">Centres totals</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-num" style="color:#801D28">${adherits}</div><div class="stat-lbl">Centres hospitalaris adherits</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-num" style="color:#2e7d32">${total-adherits}</div><div class="stat-lbl">Centres hospitalaris pendents</div></div>
    <div class="stat-sep"></div>
    <div class="progress-wrap">
      <div class="progress-lbl"><span>Progrés de la campanya</span><span style="font-weight:700;color:#801D28">${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
}

function filterZona(val) {
  currentZona = val;
  HOSPITALS.forEach(h => {
    if (!val || h.zona === val) { if (!map.hasLayer(markers[h.id])) markers[h.id].addTo(map); }
    else { if (map.hasLayer(markers[h.id])) map.removeLayer(markers[h.id]); }
  });
}

function jsonpFetch(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    window[cbName] = function(data) {
      delete window[cbName];
      document.head.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + '&callback=' + cbName;
    script.onerror = () => { delete window[cbName]; reject(new Error('JSONP error')); };
    document.head.appendChild(script);
  });
}
async function loadCentreServeis() {
  const centreId = document.getElementById('edit-centre-select').value;
  if (!centreId) { document.getElementById('edit-serveis-section').style.display='none'; return; }
  document.getElementById('edit-status').textContent = 'Carregant...';
  document.getElementById('edit-serveis-section').style.display='block';
  const list = document.getElementById('edit-serveis-list');
  list.innerHTML = '';
  try {
    const url = APPS_SCRIPT_URL + '?action=get&centre_id=' + centreId;
    const data = await jsonpFetch(url);
    if (data.ok && data.serveis && data.serveis.length > 0) {
      data.serveis.forEach(s => addServeiRow(s.servei, s.pct));
    }
  } catch(e) {
    const d = sheetData[parseInt(centreId)];
    if (d && d.serveis && d.serveis.length > 0) {
      d.serveis.forEach(s => addServeiRow(s.nom || s.servei, s.pct));
    }
  }
  document.getElementById('edit-status').textContent = '';
}

function addServeiRow(nom, pct) {
  const list = document.getElementById('edit-serveis-list');
  const row = document.createElement('div');
  row.className = 'servei-row';
  // Creem el select manualment per assegurar que les opcions existeixen abans d'assignar valor
  const select = document.createElement('select');
  select.innerHTML = '<option value="">— Servei —</option>' + SERVEIS_OPTIONS;
  if (nom) select.value = nom;
  const input = document.createElement('input');
  input.type = 'number'; input.min = '0'; input.max = '100';
  input.value = parseInt(pct) || 0; input.placeholder = '%';
  const btn = document.createElement('button');
  btn.textContent = '🗑'; btn.onclick = function(){ this.parentElement.remove(); };
  row.appendChild(select);
  row.appendChild(input);
  row.appendChild(btn);
  list.appendChild(row);
}

async function saveServeis() {
  const centreId = parseInt(document.getElementById('edit-centre-select').value);
  if (!centreId) { alert('Selecciona un centre'); return; }
  const rows = document.querySelectorAll('#edit-serveis-list .servei-row');
  const serveis = [];
  for (const row of rows) {
    const servei = row.querySelector('select').value;
    const pct = parseInt(row.querySelector('input').value) || 0;
    if (servei) serveis.push({ servei, pct });
  }
  document.getElementById('edit-status').textContent = 'Guardant...';
  document.getElementById('edit-panel').querySelector('.btn-save').disabled = true;
  try {
    const params = new URLSearchParams({
      action: 'save',
      centre_id: centreId,
      serveis: JSON.stringify(serveis)
    });
    const data = await jsonpFetch(APPS_SCRIPT_URL + '?' + params.toString());
    if (data.ok) {
      document.getElementById('edit-status').textContent = '✓ Guardat correctament';
      await syncFromSheet();
      setTimeout(closeEditPanel, 1500);
    } else {
      document.getElementById('edit-status').textContent = 'Error: ' + (data.error||'desconegut');
    }
  } catch(e) {
    document.getElementById('edit-status').textContent = 'Error de connexió';
  }
  document.getElementById('edit-panel').querySelector('.btn-save').disabled = false;
}
